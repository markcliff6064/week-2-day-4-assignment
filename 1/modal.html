<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal System</title>
</head>

<body>

    <h1>Learn More</h1>

    <button class="learn-btn" data-modal="modal1">
        Learn More 1
    </button>

    <button class="learn-btn" data-modal="modal2">
        Learn More 2
    </button>

    <button class="learn-btn" data-modal="modal3">
        Learn More 3
    </button>


    <!-- Modal 1 -->
    <div class="modal" id="modal1">

        <h2>HTML</h2>

        <p>
            HTML is used to create the structure of a web page.
        </p>

        <button class="close-btn">Close</button>

    </div>


    <!-- Modal 2 -->
    <div class="modal" id="modal2">

        <h2>CSS</h2>

        <p>
            CSS is used to style web pages.
        </p>

        <button class="close-btn">Close</button>

    </div>


    <!-- Modal 3 -->
    <div class="modal" id="modal3">

        <h2>JavaScript</h2>

        <p>
            JavaScript is used to make web pages interactive.
        </p>

        <button class="close-btn">Close</button>

    </div>


    <script src="modal.js"></script>

</body>
</html>
