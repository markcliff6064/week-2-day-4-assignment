<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priority List</title>
</head>

<body>

    <h1>Priority List</h1>

    <p>Drag the tasks to change their priority.</p>

    <ul id="taskList">

        <li draggable="true" id="task1">
            <span class="priority">1.</span>
            Deploy website
        </li>

        <li draggable="true" id="task2">
            <span class="priority">2.</span>
            Fix login bug
        </li>

        <li draggable="true" id="task3">
            <span class="priority">3.</span>
            Write tests
        </li>

        <li draggable="true" id="task4">
            <span class="priority">4.</span>
            Update documentation
        </li>

        <li draggable="true" id="task5">
            <span class="priority">5.</span>
            Backup database
        </li>

    </ul>


    <script src="drag.js"></script>

</body>
</html>
